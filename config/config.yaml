server:
    port: "8080"
    cors_origins:
        - '*'
    grpc_port: "9090"
    internal_url: localhost:9090
auth:
    jwt_secret: change-me-in-production
    token_prefix: mnx_
storage:
    database: sqlite
    sqlite:
        path: ./data/mynexus.db
    postgres:
        dsn: ""
    vector_store: chroma
    vector_store_path: ./data/vectorstore
    upload_dir: ./data/uploads
worker:
    url: localhost:8001
    max_concurrent_tasks: 1
    task_timeout_seconds: 600
embedding:
    provider: ollama
    openai:
        api_key: ""
        base_url: https://api.openai.com/v1
        model: text-embedding-3-small
    ollama:
        api_key: ""
        base_url: http://localhost:11434
        model: bge-m3
llm:
    provider: ollama
    openai:
        api_key: ""
        base_url: https://api.openai.com/v1
        model: gpt-4o-mini
    ollama:
        api_key: ""
        base_url: http://localhost:11434
        model: qwen2.5:1.5b-instruct
splitter:
    chunk_size: 500
    chunk_overlap: 50
    strategy: token
i18n:
    default_locale: zh-CN
    supported:
        - zh-CN
        - zh-TW
        - en-US
chat:
    enabled: true
