server:
  port: 8080
  cors_origins: ["*"]
  # internal_url: how Worker reaches Core API to post task progress/completion callbacks
  internal_url: "http://localhost:8080"

auth:
  jwt_secret: "change-me-in-production"
  token_prefix: "mnx_"

storage:
  # database: sqlite | postgres
  database: sqlite
  sqlite:
    path: "./data/mynexus.db"
  postgres:
    dsn: ""
  upload_dir: "./data/uploads"

  # vector_store: local (built-in, NAS-lightweight, no C-extension deps) | chroma | pgvector | qdrant
  # M3 ships the "local" backend only — see docs/系统设计文档.md §3.4 for why
  # Chroma's dependency footprint (onnxruntime, grpc, kubernetes client, ...)
  # was dropped in favor of a small numpy + rank_bm25 implementation.
  vector_store: local
  vector_store_path: "./data/vectorstore"

worker:
  url: "http://localhost:8001"
  max_concurrent_tasks: 1
  task_timeout_seconds: 600

embedding:
  # provider: openai | ollama
  provider: openai
  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    model: "text-embedding-3-small"
  ollama:
    base_url: "http://localhost:11434"
    model: "nomic-embed-text"

llm:
  # provider: openai | ollama
  provider: openai
  openai:
    api_key: ""
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
  ollama:
    base_url: "http://localhost:11434"
    model: "llama3"

splitter:
  chunk_size: 500
  chunk_overlap: 50
  strategy: "token"

i18n:
  default_locale: "zh-CN"
  supported: ["zh-CN", "zh-TW", "en-US"]
