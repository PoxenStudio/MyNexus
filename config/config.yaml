server:
    port: "8080"
    cors_origins:
        - '*'
    grpc_port: "9090"
    internal_url: localhost:9090
auth:
    jwt_secret: change-me-in-production
    token_prefix: mnx_
storage:
    database: sqlite
    sqlite:
        path: ./data/mynexus.db
    postgres:
        dsn: ""
    vector_store: chroma
    vector_store_path: ./data/vectorstore
    upload_dir: ./data/uploads
worker:
    url: localhost:8001
    max_concurrent_tasks: 1
    task_timeout_seconds: 600
embedding:
    provider: local
    openai:
        api_key: ""
        base_url: https://api.openai.com/v1
        model: text-embedding-3-small
    ollama:
        api_key: ""
        base_url: http://localhost:11434
        model: bge-m3
    local:
        model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
llm:
    provider: ollama
    openai:
        api_key: ""
        base_url: https://api.openai.com/v1
        model: gpt-4o-mini
    ollama:
        api_key: ""
        base_url: http://localhost:11434
        model: qwen2.5:7b-instruct
splitter:
    chunk_size: 500
    chunk_overlap: 50
    strategy: token
i18n:
    default_locale: zh-CN
    supported:
        - zh-CN
        - zh-TW
        - en-US
chat:
    enabled: true
    max_sessions: 100
    # Worker 侧会话工具调用最大轮数（决策-执行循环上限），达到后强制基于已积累上下文作答。
    max_tool_rounds: 3
retrieval:
    fusion: weighted
    vector_weight: 0.6
    keyword_weight: 0.4
keyword:
    max_keywords: 50
debug:
    llm_logging: true
summary:
    skip_backmatter_chapters: false
