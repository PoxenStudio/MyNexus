server:
    port: "8080"
    cors_origins:
        - '*'
    grpc_port: "9090"
    internal_url: localhost:9090
auth:
    token_prefix: mnx_
storage:
    database: sqlite
    sqlite:
        path: ./data/mynexus.db
    postgres:
        dsn: ""
    vector_store: chroma
    vector_store_path: ./data/vectorstore
    upload_dir: ./data/uploads
worker:
    url: localhost:8001
    max_concurrent_tasks: 1
    task_timeout_seconds: 600
embedding:
    provider: local
    openai:
        api_key: ""
        base_url: https://api.openai.com/v1
        model: text-embedding-3-small
    ollama:
        api_key: ""
        base_url: http://localhost:11434
        model: bge-m3
    local:
        model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        model_path: ./data/models
llm:
    provider: openai
    openai:
        api_key: mynexus-ThisIsAInvalidApiKeyDoNotUseIt
        base_url: https://api.deepseek.com
        model: deepseek-v4-flash
        chapter_token_budget: 30000
    ollama:
        api_key: ""
        base_url: http://localhost:11434
        model: qwen2.5:7b-instruct
splitter:
    chunk_size: 150
    chunk_overlap: 30
    strategy: token
i18n:
    default_locale: zh-CN
    supported:
        - zh-CN
        - zh-TW
        - en-US
chat:
    enabled: true
    max_sessions: 100
    sliding_window_size: 8
    memory_enabled: true
    return_citations: false
keyword:
    max_keywords: 50
retrieval:
    fusion: weighted
    vector_weight: 0.6
    keyword_weight: 0.4
debug:
    llm_logging: true
summary:
    skip_backmatter_chapters: false
mybooks:
    base_url: http://192.168.1.227:8082
    username: horky
    password: Ccusr561273
