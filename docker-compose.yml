version: "3.8"

services:
  core-api:
    build:
      context: ./core-api
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - MYNEXUS_CONFIG_PATH=/app/config/config.yaml
      - MYNEXUS_SERVER_PORT=8080
      - MYNEXUS_SERVER_INTERNAL_URL=http://core-api:8080
      - MYNEXUS_WORKER_URL=http://worker:8001
      - MYNEXUS_AUTH_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      # STORAGE_DATABASE selects the backend without editing config/config.yaml:
      # "sqlite" (default) or "postgres" (pair with `docker compose --profile postgres up`
      # to also start the bundled postgres service below).
      - MYNEXUS_STORAGE_DATABASE=${STORAGE_DATABASE:-sqlite}
      - MYNEXUS_STORAGE_POSTGRES_DSN=${STORAGE_POSTGRES_DSN:-postgres://mynexus:mynexus@postgres:5432/mynexus?sslmode=disable}
    depends_on:
      - worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # Optional Postgres backend — only started when storage.database is set to
  # "postgres" (via STORAGE_DATABASE=postgres) and this profile is enabled:
  #   STORAGE_DATABASE=postgres docker compose --profile postgres up -d
  # Not needed for the default sqlite deployment.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mynexus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mynexus}
      - POSTGRES_DB=${POSTGRES_DB:-mynexus}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - PORT=8001
      - MYNEXUS_CONFIG_PATH=/app/config/config.yaml
      - MYNEXUS_EMBEDDING_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MYNEXUS_LLM_OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # ChromaDB (HNSW index + onnxruntime import) plus FastAPI needs more
          # headroom than a bare-bones worker — sized for a 4GB+ NAS, not the
          # 512MB budget the earlier "avoid Chroma" decision assumed.
          memory: 1536M

  web-ui:
    build:
      context: ./web-ui
    ports:
      - "3000:80"
    depends_on:
      - core-api
    restart: unless-stopped
