services:
  mynexus:
    image: poxenstudio/mynexus:latest
    ports:
      - "${MYNEXUS_PORT:-3000}:80"
    volumes:
      - ${MYNEXUS_DATA_DIR:-./data}:/data
      - ${MYNEXUS_CONFIG_DIR:-./config-runtime}:/config
    environment:
      MYNEXUS_CONFIG_PATH: /config/config.yaml
      MYNEXUS_API_TOKEN: ${MYNEXUS_API_TOKEN:-}
      MYNEXUS_LLM_PROVIDER: openai
      MYNEXUS_LLM_OPENAI_API_KEY: ${MYNEXUS_LLM_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      # MYNEXUS_LLM_OPENAI_BASE_URL: https://api.openai.com/v1
      # MYNEXUS_LLM_OPENAI_MODEL: gpt-4o-mini
      # 如需切换 Ollama 本地服务，取消以下注释
      # MYNEXUS_LLM_PROVIDER: ollama
      # MYNEXUS_LLM_OLLAMA_BASE_URL: http://host.docker.internal:11434
      # MYNEXUS_LLM_OLLAMA_MODEL: llama3
    restart: unless-stopped
