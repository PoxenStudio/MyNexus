services:
  mynexus:
    image: poxenstudio/mynexus:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BASE_IMAGE: ${BASE_IMAGE:-poxenstudio/mynexus_base:latest}
    ports:
      - "${MYNEXUS_PORT:-3000}:80"
    volumes:
      - ${MYNEXUS_DATA_DIR:-./data}:/data
      - ${MYNEXUS_CONFIG_DIR:-./config-runtime}:/config
    environment:
      MYNEXUS_CONFIG_PATH: /config/config.yaml
      MYNEXUS_EXPORT_TOKEN: ${MYNEXUS_EXPORT_TOKEN:-}
      MYNEXUS_EMBEDDING_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MYNEXUS_LLM_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    restart: unless-stopped
