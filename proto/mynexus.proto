// Core API <-> Worker internal RPC contract. Replaces the earlier HTTP+JSON
// /internal/* endpoints on both sides (see .claude/memory/mynexus_grpc_migration.md)
// with gRPC over a single persistent HTTP/2 connection per direction: fewer
// TCP/TLS handshakes than one-shot HTTP/1.1 requests, binary protobuf instead
// of JSON marshal/unmarshal, and native support for the chat streaming case.
//
// Two independent services because the relationship is bidirectional:
// Core API calls Worker to trigger ingestion/search/chat, and Worker calls
// Core API back to report task progress and to run Postgres-only keyword
// search (see .claude/memory/mynexus_keyword_search_gin.md). Each side is
// simultaneously a gRPC client (of the other service) and a gRPC server (of
// its own service).
syntax = "proto3";

package mynexus;

option go_package = "mynexus/core-api/internal/grpcapi/mynexuspb";

// ---- WorkerService: implemented by Worker, called by Core API ----

service WorkerService {
  // Starts parsing file_path in the background and returns immediately;
  // Worker reports progress/completion/failure back via CoreApiService.
  rpc TriggerIngest(IngestRequest) returns (IngestAck);

  // Synchronous hybrid (vector + keyword) search.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Streaming RAG chat: yields answer deltas, then exactly one citations
  // message as the final element.
  rpc Chat(ChatRequest) returns (stream ChatChunk);

  // Acknowledges then exits the process shortly after replying — Core API
  // calls this after rewriting config.yaml from the system settings page, so
  // Worker restarts and picks up new embedding/llm/splitter config. Relies on
  // an external supervisor (Docker Compose's `restart: unless-stopped`) to
  // bring the process back up; in a bare `python3 server.py` dev run nothing
  // restarts it automatically. Best-effort: Core API ignores failures here
  // (Worker being unreachable already means it isn't running to restart).
  rpc Shutdown(ShutdownRequest) returns (Ack);

  // Re-embeds just the whole-book summary as a single retrievable chunk
  // (stable id "{book_id}:summary" — see pipelines/summary.py's
  // _index_summary), after a manual edit via BookHandler.UpdateSummary.
  // Synchronous (one embedding call) unlike TriggerIngest/TriggerSummarize's
  // fire-and-forget background jobs — there's no multi-stage progress to
  // report. Best-effort from Core API's point of view: the summary text
  // itself is already persisted by the time this is called, so a failure
  // here just means retrieval keeps serving the previous (now stale)
  // summary vector until the next successful call.
  rpc ReembedBookSummary(ReembedBookSummaryRequest) returns (Ack);

  // Starts a map-reduce summarization run in the background and returns
  // immediately, mirroring TriggerIngest: Worker never touches Core API's
  // database directly (see .claude/memory/mynexus_m2_decisions.md), so the
  // chapters to summarize are sent in the request rather than fetched by
  // Worker itself. Map: each chapter is summarized individually and reported
  // back (and persisted) as soon as it's done via ReportChapterSummary, so
  // partial progress survives a mid-run crash. Reduce: once every chapter
  // has a summary, they're combined into one whole-book summary, reported
  // via ReportBookSummary — which also marks the task complete.
  rpc TriggerSummarize(SummarizeRequest) returns (SummarizeAck);

  // Purges every vector-store record for book_id (synchronous, unary — the
  // vector store is local to Worker so this never touches Core API's own
  // database). Called by Core API on book delete and before re-ingesting on
  // rebuild, so ChromaDB/SimpleVectorStore never accumulates orphaned
  // embeddings for a book_id that no longer exists in `books`/`chunks` —
  // those otherwise still get retrieved and cited by chat with no way to
  // resolve the id back to a real book (see .claude/memory/mynexus_orphaned_vectors.md).
  rpc DeleteBook(DeleteBookRequest) returns (Ack);

  // Asks Worker to interrupt a running background task (currently only
  // summarize runs check the flag — at chapter boundaries and inside the
  // streaming LLM loop, so cancellation lands within seconds). Ack.ok is
  // false when Worker has no active task with that id (e.g. it restarted and
  // lost its in-memory state), letting Core API mark the task canceled
  // directly instead of waiting for a report that will never come. The task
  // reaches its terminal canceled state via ReportFail(canceled=true), not
  // from this call itself.
  rpc CancelTask(CancelTaskRequest) returns (Ack);

  // Exports a book's vector records in bounded batches. The embedding itself
  // is included so derived-data archives can be restored on another device.
  rpc ExportBookVectors(VectorBookRequest) returns (stream VectorRecord);
  // Imports vectors under a temporary book id. The caller must explicitly
  // commit or discard that staged set after its database transaction finishes.
  rpc ImportBookVectors(stream VectorRecord) returns (Ack);
  rpc CommitBookVectorImport(CommitBookVectorImportRequest) returns (Ack);
  rpc RollbackBookVectorImport(RollbackBookVectorImportRequest) returns (Ack);
  rpc FinalizeBookVectorImport(FinalizeBookVectorImportRequest) returns (Ack);
}

message VectorBookRequest {
  string book_id = 1;
}

message VectorRecord {
  string id = 1;
  string book_id = 2;
  string chapter_id = 3;
  string content = 4;
  int32 position = 5;
  int32 token_count = 6;
  int32 start_offset = 7;
  int32 end_offset = 8;
  repeated float embedding = 9;
}

message CommitBookVectorImportRequest {
  string book_id = 1;
  string staging_book_id = 2;
  string backup_book_id = 3;
}

message RollbackBookVectorImportRequest {
  string book_id = 1;
  string staging_book_id = 2;
  string backup_book_id = 3;
}

message FinalizeBookVectorImportRequest {
  string staging_book_id = 1;
  string backup_book_id = 2;
}

message CancelTaskRequest {
  string task_id = 1;
}

message ReembedBookSummaryRequest {
  string book_id = 1;
  string summary = 2;
}

message DeleteBookRequest {
  string book_id = 1;
}

message ShutdownRequest {}

message SummarizeRequest {
  string task_id = 1;
  string book_id = 2;
  repeated Chapter chapters = 3;
  // When false, chapters that already carry a non-empty `summary` are left
  // untouched and only the missing ones are (re)generated — "continue"
  // mode. When true, every chapter is regenerated regardless of any
  // existing summary — "restart" mode.
  bool force_restart = 4;
  // Book's language code (books.language — MyBooks-style 3-letter code,
  // e.g. "eng"/"zho"/"zha"/"jpn", see worker/src/util/lang_detect.py's
  // title-based detection). Selects which prompt language
  // pipelines/summary.py writes chapter/book summaries in and which
  // keyword-extraction path (jieba for Chinese, NLTK POS-noun-filtering for
  // English) it runs. Only "eng" selects English; everything else
  // (including empty) is treated as Chinese.
  string language = 5;
}

message SummarizeAck {
  bool accepted = 1;
}

message IngestRequest {
  string task_id = 1;
  string book_id = 2;
  string file_path = 3;
  string original_filename = 4;
}

message IngestAck {
  bool accepted = 1;
}

message SearchRequest {
  string query = 1;
  repeated string book_ids = 2;
  int32 top_k = 3;
  double score_threshold = 4;
}

message SearchResult {
  string chunk_id = 1;
  string book_id = 2;
  string chapter_id = 3;
  string content = 4;
  int32 position = 5;
  int32 token_count = 6;
  double score = 7;
  int32 start_offset = 8;
  int32 end_offset = 9;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message ChatRequest {
  repeated ChatMessage messages = 1;
  repeated string book_ids = 2;
  int32 top_k = 3;
}

message Citation {
  string chunk_id = 1;
  string chapter_id = 2;
  string book_id = 3;
  double score = 4;
  string content = 5;
  int32 start_offset = 6;
  int32 end_offset = 7;
}

message CitationList {
  repeated Citation items = 1;
}

message ToolResult {
  string tool_name = 1;
  string result_json = 2;
}

// One chunk of a streamed chat reply: either an answer-text delta, a structured
// tool result (e.g. mindmap markdown), or (the final message in the stream) the
// full citation list.
message ChatChunk {
  oneof payload {
    string delta = 1;
    CitationList citations = 2;
    ToolResult tool_result = 3;
  }
}

// ---- CoreApiService: implemented by Core API, called by Worker ----

service CoreApiService {
  rpc ReportProgress(ProgressRequest) returns (Ack);
  // Persists title/author/language as soon as parsing succeeds, well before
  // splitting/embedding finish — so a book's metadata is visible in the UI
  // even if a later stage (e.g. the embedding API call) fails. ReportComplete
  // still sends BookMeta too, as a harmless overwrite with the same values,
  // to keep the "everything happens in ReportComplete on success" case simple.
  rpc ReportMetadata(MetadataRequest) returns (Ack);
  rpc ReportComplete(CompleteRequest) returns (Ack);
  rpc ReportFail(FailRequest) returns (Ack);

  // Map step of summarization: persists one chapter's summary immediately
  // (see TriggerSummarize). Does not touch the task's status/progress or the
  // book's ingest status — ReportProgress covers progress, and a book being
  // "ready" (already ingested) is independent of whether a later
  // summarization run is in flight or has failed.
  rpc ReportChapterSummary(ChapterSummaryRequest) returns (Ack);
  // Reduce step: persists the whole-book summary and marks the summarize
  // task completed.
  rpc ReportBookSummary(BookSummaryRequest) returns (Ack);

  // Token-consumption accounting: Worker reports one LLM call's usage right
  // after it happens, so Core API can aggregate per book / day / provider
  // for the book-detail card and the dashboard. Fire-and-forget from the
  // Worker side — a report failure is logged but never aborts the task that
  // was actually doing useful work (summarizing / embedding / chatting).
  rpc ReportTokenUsage(TokenUsageRequest) returns (Ack);

  // Postgres-only GIN-indexed keyword search (see
  // .claude/memory/mynexus_keyword_search_gin.md) — Worker calls this
  // read-only endpoint instead of building a BM25 index in-process when
  // storage.database == "postgres"; unimplemented (NOT_FOUND) on sqlite.
  rpc KeywordSearch(KeywordSearchRequest) returns (KeywordSearchResponse);

  // Read-only system-status query, called by Worker's QA pipeline when the
  // LLM invokes the "get_library_stats" chat tool (see
  // .claude/memory/mynexus_chat_tool_calling.md) — lets the chat assistant
  // answer "how many books are ingested" etc. without those numbers needing
  // to appear in any retrieved chunk. First of what's meant to grow into a
  // small family of read-only stats/lookup RPCs behind chat tools, not a
  // one-off: keep new ones in this same shape (empty or narrow request,
  // structured response) rather than a single do-everything RPC.
  rpc GetLibraryStats(LibraryStatsRequest) returns (LibraryStatsResponse);

  // Read-only chapter-content lookup, called by Worker's QA pipeline when the
  // LLM invokes the "read_chapter" chat tool — returns the chapter's cleaned
  // plain-text content (same text the chunks were split from, so character
  // offsets align) plus title/order for display. Backs sequential-reading
  // questions (chapter overview, character relations) that semantic retrieval
  // handles poorly. Read-only; no task/state side effects.
  rpc GetChapterContent(ChapterContentRequest) returns (ChapterContentResponse);

  // Read-only book-metadata/summary lookup, called by Worker's QA pipeline
  // when the LLM invokes the "get_book_info" chat tool — returns every
  // field a book record carries (title/author/publisher/category/tags,
  // the whole-book summary, and each chapter's title+summary) so the
  // assistant can answer "这本书讲了什么"/"作者是谁"/"第三章讲了什么"
  // directly from already-generated text, instead of relying on noisy
  // chunk-level RAG retrieval for what's structurally a lookup, not a
  // search. query matches case-insensitively against title/author
  // (substring, same as BookHandler.List's ?q=); results are capped
  // server-side (see the Go handler) so a vague query can't dump the
  // whole library into one tool response.
  rpc GetBookInfo(BookInfoRequest) returns (BookInfoResponse);

  // Read-only summary lookup for one book: every chapter whose persisted
  // summary is non-empty (chapter_id + summary text), plus the whole-book
  // summary. Called by Worker right after ReportComplete so it can restore
  // the "{chapter_id}:summary"/"{book_id}:summary" vectors that its own
  // delete_by_book wiped at the start of a rebuild — chapter summaries
  // survive the re-ingest (SaveChapters carries them over by title), but
  // their vectors don't. Read-only; no task/state side effects.
  rpc GetChapterSummaries(ChapterSummariesRequest) returns (ChapterSummariesResponse);
}

message ChapterSummariesRequest {
  string book_id = 1;
}

message ChapterSummaryEntry {
  string chapter_id = 1;
  string summary = 2;
}

message ChapterSummariesResponse {
  repeated ChapterSummaryEntry chapters = 1;
  string book_summary = 2;
}

message ProgressRequest {
  string task_id = 1;
  int32 progress = 2;
  string stage = 3;
  string message = 4;
}

message Ack {
  bool ok = 1;
}

message BookMeta {
  string title = 1;
  string author = 2;
  string language = 3;
}

message Chapter {
  string id = 1;
  string title = 2;
  int32 level = 3;
  int32 sort_order = 4;
  string content = 5;
  string summary = 6;
  repeated Keyword keywords = 7;
  repeated string references = 8;
}

message Chunk {
  string id = 1;
  string chapter_id = 2;
  string content = 3;
  int32 position = 4;
  int32 token_count = 5;
  string vector_id = 6;
  int32 start_offset = 7;
  int32 end_offset = 8;
}

message MetadataRequest {
  string task_id = 1;
  BookMeta book = 2;
}

message CompleteRequest {
  string task_id = 1;
  BookMeta book = 2;
  repeated Chapter chapters = 3;
  repeated Chunk chunks = 4;
  // Cover image bytes, if Worker was able to produce one — either extracted
  // from the source file (EPUB cover item) or, failing that, generated from
  // the book's title (see worker/src/util/cover_generator.py). Empty if
  // neither worked (cover_content_type is empty too in that case). Core API
  // only persists this when the book doesn't already have a cover from an
  // explicit cover_url given at import time — see grpcserver.ReportComplete
  // and BookHandler.Import's cover_url form field.
  bytes cover = 5;
  // MIME type of `cover` (e.g. "image/jpeg", "image/png"); empty iff cover is empty.
  string cover_content_type = 6;
}

message FailRequest {
  string task_id = 1;
  string error_msg = 2;
  // true when the task ended by user cancellation (see CancelTask) rather
  // than an actual failure — Core API records it with the distinct terminal
  // status "canceled" instead of "failed", so the UI shows "已取消" without
  // a red error.
  bool canceled = 3;
}

message ChapterSummaryRequest {
  string task_id = 1;
  string chapter_id = 2;
  string summary = 3;
  // This chapter's own top-N content keywords (local jieba/NLTK extraction,
  // see worker/src/util/keywords.py and pipelines/summary.py's
  // _extract_chapter_keywords) — distinct from BookSummaryRequest.keywords,
  // which is the whole-book reduction across every chapter.
  repeated Keyword keywords = 4;
  // Terms/concepts defined in this chapter's text, LLM-extracted (see
  // pipelines/summary.py's _extract_chapter_definitions) — the definition
  // given by the book itself, not one the model invents.
  repeated Definition definitions = 5;
  // Works / titles cited or mentioned in this chapter — LLM-extracted from
  // the raw text, aggregated across all chapters to build the book-level
  // reference_index markdown table (see worker/src/pipelines/summary.py).
  repeated string references = 6;
}

message Definition {
  string name = 1;
  string content = 2;
}

message BookSummaryRequest {
  string task_id = 1;
  string book_id = 2;
  string summary = 3;
  repeated Keyword keywords = 4;
  string reading_guide = 5;
  string reference_index = 6;
}

message TokenUsageRequest {
  string task_id = 1;
  string book_id = 2;
  // ingest | summary | chat — which pipeline produced this call.
  string task_type = 3;
  string llm_provider = 4; // "openai" | "ollama"
  string llm_model = 5;   // e.g. "deepseek-v4-flash"
  // Pipeline-local site tag, e.g. "summary.chapter_analyze",
  // "summary.book_reduce" — lets the dashboard slice by call site later.
  string call_site = 6;
  int32 prompt_tokens = 7;
  int32 completion_tokens = 8;
  int32 total_tokens = 9;
}

message Keyword {
  string term = 1;
  double weight = 2;
}

message KeywordSearchRequest {
  string query = 1;
  repeated string book_ids = 2;
  int32 top_k = 3;
}

message KeywordSearchResult {
  string chunk_id = 1;
  string book_id = 2;
  double score = 3;
}

message KeywordSearchResponse {
  repeated KeywordSearchResult results = 1;
}

message LibraryStatsRequest {}

message BookStatusCount {
  string status = 1;
  int32 count = 2;
}

message LibraryStatsResponse {
  int32 total_books = 1;
  repeated BookStatusCount by_status = 2;
}

message BookInfoRequest {
  string query = 1;
}

message ChapterContentRequest {
  string book_id = 1;
  string chapter_id = 2;
}

message ChapterContentResponse {
  string chapter_id = 1;
  string title = 2;
  string content = 3;
  int32 sort_order = 4;
}

message ChapterInfo {
  string chapter_id = 1;
  string title = 2;
  string summary = 3;
  int32 sort_order = 4;
}

message BookInfo {
  string book_id = 1;
  string title = 2;
  string author = 3;
  string publisher = 4;
  string category = 5;
  repeated string tags = 6;
  // Whole-book summary (see BookSummaryRequest) — empty if summarization
  // hasn't run for this book yet.
  string summary = 7;
  // Ordered same as ListChapters (by sort_order); a chapter's summary is
  // empty if the map step hasn't produced one yet.
  repeated ChapterInfo chapters = 8;
}

message BookInfoResponse {
  repeated BookInfo books = 1;
}
