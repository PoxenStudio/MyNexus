# MyNexus worker 日志轮转参考配置
# 放置到 /etc/logrotate.d/mynexus 即可生效（Linux）
# 本地开发环境可直接用 Python RotatingFileHandler，无需 logrotate

/data/logs/worker.log {
    size 5M
    rotate 7
    copytruncate
    compress
    delaycompress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d
    create 0644 root root
}
