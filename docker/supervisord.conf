[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/nginx/supervisord.pid

[program:core-api]
command=/app/mynexus-api
user=nexus
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/python /app/worker/src/server.py
directory=/app/worker/src
user=nexus
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
